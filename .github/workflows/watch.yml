name: Preiswächter

on:
  schedule:
    # alle 30 Minuten (UTC). GitHub startet geplante Läufe oft einige Minuten später.
    - cron: "11,41 * * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Nur Testnachricht senden"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pricewatch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testnachricht
        if: ${{ inputs.test_notify }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python -m pricewatch --test-notify

      - name: Preise prüfen
        if: ${{ !inputs.test_notify }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python -m pricewatch

      - name: Verlauf speichern
        if: ${{ !inputs.test_notify }}
        run: |
          git config user.name "pricewatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "keine Änderungen"
            exit 0
          fi
          git commit -m "Preise $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
          git pull --rebase --quiet
          git push
