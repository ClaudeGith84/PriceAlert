name: Preiswächter

on:
  schedule:
    # alle 30 Minuten (UTC). GitHub startet geplante Läufe oft einige Minuten später.
    - cron: "11,41 * * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Nur Testnachricht senden"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pricewatch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # nur für den Commit des Preisverlaufs
    steps:
      # Actions per Commit-SHA gepinnt (Tags sind verschiebbar); Dependabot hält sie aktuell.
      # Token nicht in .git/config ablegen – pip-Pakete und Shop-HTML sollen ihn nicht sehen.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install --require-hashes -r requirements.txt

      - name: Testnachricht
        if: ${{ inputs.test_notify }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python -m pricewatch --test-notify

      - name: Preise prüfen
        if: ${{ !inputs.test_notify }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python -m pricewatch

      - name: Verlauf speichern
        if: ${{ !inputs.test_notify }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "pricewatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "keine Änderungen"
            exit 0
          fi
          git commit -m "Preise $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
          git pull --rebase --quiet
          git push
